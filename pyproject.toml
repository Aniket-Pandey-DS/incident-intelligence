[project]
name = "incident-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.2.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]